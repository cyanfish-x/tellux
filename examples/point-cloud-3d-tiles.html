<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="2.3" />
  <meta name="sandcastle-thumbnail" content="./images/3dtiles.png" />
  <title data-i18n="example.point-cloud-3d-tiles.docTitle">Tellux 点云 3D Tiles</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="point-cloud-panel" data-i18n-attr="aria-label:example.point-cloud-3d-tiles.panel.aria" aria-label="点云 3D Tiles 加载控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="point-cloud-panel-fold"
          aria-expanded="true"
          aria-controls="point-cloud-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.point-cloud-3d-tiles.panel.title">点云 3D Tiles</span>
      </header>

      <div class="example-panel__collapse" id="point-cloud-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.point-cloud-3d-tiles.folder.load">加载</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-asset-id" data-i18n="example.3d-tiles.label.assetId">Cesium Ion asset id</label>
                  <input id="ion-asset-id" class="example-panel__input" type="text" autocomplete="off" spellcheck="false" />
                </div>
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-token" data-i18n="example.3d-tiles.label.token">Cesium Ion token</label>
                  <input id="ion-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                </div>
                <button class="example-panel__button" id="load-tileset" type="button" data-i18n="example.point-cloud-3d-tiles.btn.load">加载点云</button>
                <button class="example-panel__button example-panel__button--ghost" id="fly-to-city" type="button" data-i18n="example.point-cloud-3d-tiles.btn.flyTo">定位到墨尔本</button>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.point-cloud-3d-tiles.label.pointSize">点大小（像素）</span>
                  <input
                    id="point-size"
                    class="example-panel__input"
                    type="number"
                    min="1"
                    max="16"
                    step="1"
                    value="4"
                  />
                </label>
                <p class="example-panel__hint" data-i18n="example.point-cloud-3d-tiles.hint">默认加载 Cesium Ion Melbourne Point Cloud（asset 43978）。Three.js 默认点大小在地球尺度下几乎看不见，这里按屏幕像素绘制。</p>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.point-cloud-3d-tiles.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="tileset-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./point-cloud-3d-tiles.ts"></script>
</body>

</html>
