<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260703212149692.png" />
  <title>Tellux Imagery Data Sources</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="example-panel example-panel--wide" aria-label="图层管理器">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          aria-expanded="true"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">图层管理器</span>
      </header>
      <div class="example-panel__collapse">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">图层</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div id="overlay-list" class="layer-manager__list"></div>
                <p id="layer-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./data-sources.ts"></script>
</body>

</html>
