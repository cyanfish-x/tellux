<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="62" />
  <title data-i18n="example.symbol.docTitle">Tellux 图标与文字标签</title>
  <link rel="stylesheet" href="./styles.css" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260704205307091.png" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="symbol-panel" data-i18n-attr="aria-label:example.symbol.panel.aria" aria-label="图标与文字标签控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="symbol-panel-fold"
          aria-expanded="true"
          aria-controls="symbol-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.symbol.panel.title">图标与文字标签</span>
      </header>

      <div class="example-panel__collapse" id="symbol-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.symbol.folder.display">显示</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.symbol.label.poi">POI（图标+文字）</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-poi" checked />
                </label>
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.symbol.label.labels">纯文字标签</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-labels" checked />
                </label>
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.symbol.label.icons">纯图标</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-icons" checked />
                </label>
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.symbol.label.multiline">多行/背景</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-multiline" checked />
                </label>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.symbol.folder.actions">操作</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <button class="example-panel__button" id="recolor-label" type="button" data-i18n="example.symbol.btn.recolor">改色（不重建）</button>
                <button class="example-panel__button example-panel__button--ghost" id="clear-symbols" type="button" data-i18n="example.symbol.btn.clear">
                  清空实体
                </button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.symbol.folder.stress">压测</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.symbol.label.count">数量（1–20000）</span>
                  <input
                    id="stress-count"
                    class="example-panel__input"
                    type="number"
                    min="1"
                    max="20000"
                    step="1"
                    value="2000"
                  />
                </label>
                <button class="example-panel__button" id="generate-stress" type="button" data-i18n="example.symbol.btn.genStress">生成压测 Symbol</button>
                <button class="example-panel__button example-panel__button--ghost" id="clear-stress" type="button" data-i18n="example.symbol.btn.clearStress">
                  清空压测
                </button>
                <p class="example-panel__hint" id="stress-hint" data-i18n="example.symbol.hint.stress">
                  在演示区网格散布 icon+text；文字从固定词表轮换以复用 SDF/atlas。
                </p>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.symbol.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="symbol-status" class="example-panel__status" aria-live="polite" data-i18n="example.symbol.status.initial">加载中…</p>
                <div class="example-panel__pick">
                  <span class="example-panel__pick-key" data-i18n="example.symbol.pick.key">拾取</span>
                  <span id="symbol-pick-readout" class="example-panel__pick-value" data-i18n="example.symbol.pick.hint">点击任意标签查看属性</span>
                </div>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./symbol.ts"></script>
</body>

</html>
