<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="3" />
  <meta name="sandcastle-thumbnail" content="./images/pick.png" />
  <title data-i18n="example.3d-tiles-picking.docTitle">Tellux 拾取与高亮</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="pick-panel" data-i18n-attr="aria-label:example.3d-tiles-picking.panel.aria" aria-label="拾取与高亮控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="pick-panel-fold"
          aria-expanded="true"
          aria-controls="pick-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.3d-tiles-picking.panel.title">拾取与高亮</span>
      </header>

      <div class="example-panel__collapse" id="pick-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.3d-tiles-picking.folder.load">加载</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-asset-id" data-i18n="example.3d-tiles.label.assetId">Cesium Ion asset id</label>
                  <input id="ion-asset-id" class="example-panel__input" type="text" autocomplete="off" spellcheck="false" />
                </div>
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-token" data-i18n="example.3d-tiles.label.token">Cesium Ion token</label>
                  <input id="ion-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                </div>
                <button class="example-panel__button" id="load-tileset" type="button" data-i18n="example.3d-tiles-picking.btn.load">加载</button>
                <button class="example-panel__button example-panel__button--ghost" id="clear-selection" type="button" data-i18n="example.3d-tiles-picking.btn.clear">清除选择</button>
                <p class="example-panel__hint" data-i18n="example.3d-tiles-picking.hint">移动鼠标高亮 feature，点击后锁定选择并展示属性。</p>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.3d-tiles-picking.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="pick-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>

    <div id="feature-hover" class="feature-hover" hidden></div>
    <aside id="feature-popup" class="feature-popup" hidden aria-live="polite"></aside>
  </main>
  <script type="module" src="./3d-tiles-picking.ts"></script>
</body>

</html>
