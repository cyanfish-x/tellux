<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="sandcastle-order" content="3" />
    <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260612224058898.png" />
    <title data-i18n="example.atmosphere.docTitle">Tellux 体积云与大气</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <div id="viewer"></div>
      <aside class="example-panel" data-i18n-attr="aria-label:example.atmosphere.panel.aria" aria-label="大气与云控件">
        <header class="example-panel__chrome">
          <button
            type="button"
            class="example-panel__fold"
            aria-expanded="true"
            title="收起面板"
            aria-label="收起面板"
            data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
          ></button>
          <span class="example-panel__title" data-i18n="example.atmosphere.panel.title">体积云与大气</span>
        </header>

        <div class="example-panel__collapse">
          <div class="example-panel__content">
            <details class="example-panel__folder" open>
              <summary class="example-panel__folder-summary" data-i18n="example.atmosphere.folder.place">地点</summary>
              <div class="example-panel__folder-collapse">
                <div class="example-panel__folder-body">
                  <p class="example-panel__hint" data-i18n="example.atmosphere.hint">使用右上角公共设置面板调整大气、体积云、日期、光照和曝光。</p>
                  <button class="example-panel__button" id="dujiangyan" type="button" data-i18n="example.atmosphere.btn.dujiangyan">紫坪铺水库</button>
                  <button class="example-panel__button" id="himalaya" type="button" data-i18n="example.atmosphere.btn.himalaya">喜马拉雅</button>
                </div>
              </div>
            </details>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="./atmosphere.ts"></script>
  </body>
</html>
