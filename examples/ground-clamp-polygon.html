<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="62" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260703205654960.png" />
  <title>Tellux 贴地面</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="example-panel" aria-label="贴地面控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          aria-expanded="true"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">贴地面</span>
      </header>

      <div class="example-panel__collapse">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">显示</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p class="example-panel__hint">
                  <code>polygon.clamp: true</code> 支持凹多边形贴地；青色为贴地凹多边形，黄色为固定高对比平面。
                </p>
                <label class="example-panel__row">
                  <span class="example-panel__label">贴地面</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-clamp" checked />
                </label>
                <label class="example-panel__row">
                  <span class="example-panel__label">固定高平面</span>
                  <input class="example-panel__checkbox" type="checkbox" id="toggle-reference" checked />
                </label>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="clamp-status" class="example-panel__status" aria-live="polite">加载中…</p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./ground-clamp-polygon.ts"></script>
</body>

</html>
