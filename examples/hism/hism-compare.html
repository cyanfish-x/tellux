<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="73" />
  <title>Tellux HISM Compare</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .compare-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: min(360px, calc(100vw - 24px));
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(8, 16, 28, 0.88);
      color: #e8f1ff;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .compare-hud h2 {
      margin: 0 0 8px;
      font: 600 13px/1.2 system-ui, sans-serif;
      color: #fff;
    }

    .compare-hud dl {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 4px 10px;
      margin: 0;
    }

    .compare-hud dt {
      color: #8fb4ff;
    }

    .compare-hud dd {
      margin: 0;
      text-align: right;
    }

    .compare-table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
      font-size: 11px;
    }

    .compare-table th,
    .compare-table td {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 6px;
      text-align: right;
    }

    .compare-table th:first-child,
    .compare-table td:first-child {
      text-align: left;
      color: #8fb4ff;
    }

    progress {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="compare-hud" aria-live="polite">
      <h2>Live Metrics</h2>
      <dl>
        <dt>Mode</dt>
        <dd id="compare-live-mode">-</dd>
        <dt>FPS</dt>
        <dd id="compare-live-fps">-</dd>
        <dt>Instances</dt>
        <dd id="compare-live-instances">-</dd>
        <dt>Visible</dt>
        <dd id="compare-live-visible">-</dd>
        <dt>Draw Calls</dt>
        <dd id="compare-live-drawcalls">-</dd>
        <dt>Load</dt>
        <dd id="compare-live-load">-</dd>
      </dl>
      <table class="compare-table" aria-label="Legacy vs HISM comparison">
        <thead>
          <tr>
            <th>Metric</th>
            <th>Legacy</th>
            <th>HISM</th>
          </tr>
        </thead>
        <tbody id="compare-summary-body">
          <tr>
            <td colspan="3">生成后自动填入对比结果</td>
          </tr>
        </tbody>
      </table>
    </aside>
    <aside class="example-panel" id="compare-panel" aria-label="Legacy vs HISM 性能对比控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="compare-panel-fold"
          aria-expanded="true"
          aria-controls="compare-panel-body"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">Legacy vs HISM 性能对比</span>
      </header>

      <div class="example-panel__collapse" id="compare-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">参数</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label">实例数量（1 – 10,000,000）</span>
                  <input
                    id="compare-count"
                    class="example-panel__input"
                    type="number"
                    min="1"
                    max="10000000"
                    step="1"
                    value="10000"
                  />
                </label>
                <div class="example-panel__field">
                  <span class="example-panel__label">渲染模式</span>
                  <label class="example-panel__row">
                    <span class="example-panel__label">Legacy InstancedMesh</span>
                    <input class="example-panel__checkbox" type="radio" name="compare-mode" value="legacy" />
                  </label>
                  <label class="example-panel__row">
                    <span class="example-panel__label">HISM</span>
                    <input class="example-panel__checkbox" type="radio" name="compare-mode" value="hism" checked />
                  </label>
                </div>
                <label class="example-panel__row">
                  <span class="example-panel__label">地形采样（≤ 5000 实例时可用）</span>
                  <input id="compare-sample-terrain" class="example-panel__checkbox" type="checkbox" checked />
                </label>
                <p class="example-panel__hint" id="compare-hint">
                  超过 5000 实例将使用快速随机散布 + 椭球高度 0，以保证百万级规模可生成。
                </p>
                <progress id="compare-progress" max="100" value="0" hidden></progress>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">操作</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <button class="example-panel__button" id="compare-generate" type="button">生成并测速</button>
                <button class="example-panel__button example-panel__button--ghost" id="compare-flyto" type="button" disabled>
                  飞到场景
                </button>
                <button class="example-panel__button example-panel__button--ghost" id="compare-clear" type="button">
                  清空场景
                </button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="compare-status" class="example-panel__status" aria-live="polite">正在初始化模板...</p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./hism-compare.ts"></script>
</body>

</html>
