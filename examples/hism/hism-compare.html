<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="73" />
  <title>Tellux HISM Compare</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .compare-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: min(360px, calc(100vw - 24px));
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(8, 16, 28, 0.88);
      color: #e8f1ff;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .compare-hud h2 {
      margin: 0 0 8px;
      font: 600 13px/1.2 system-ui, sans-serif;
      color: #fff;
    }

    .compare-hud dl {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 4px 10px;
      margin: 0;
    }

    .compare-hud dt {
      color: #8fb4ff;
    }

    .compare-hud dd {
      margin: 0;
      text-align: right;
    }

    .compare-table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
      font-size: 11px;
    }

    .compare-table th,
    .compare-table td {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 6px;
      text-align: right;
    }

    .compare-table th:first-child,
    .compare-table td:first-child {
      text-align: left;
      color: #8fb4ff;
    }

    progress {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="compare-hud" aria-live="polite">
      <h2>Live Metrics</h2>
      <dl>
        <dt>Mode</dt>
        <dd id="compare-live-mode">-</dd>
        <dt>FPS</dt>
        <dd id="compare-live-fps">-</dd>
        <dt>Instances</dt>
        <dd id="compare-live-instances">-</dd>
        <dt>Visible</dt>
        <dd id="compare-live-visible">-</dd>
        <dt>Draw Calls</dt>
        <dd id="compare-live-drawcalls">-</dd>
        <dt>Load</dt>
        <dd id="compare-live-load">-</dd>
      </dl>
      <table class="compare-table" aria-label="Legacy vs HISM comparison">
        <thead>
          <tr>
            <th>Metric</th>
            <th>Legacy</th>
            <th>HISM</th>
          </tr>
        </thead>
        <tbody id="compare-summary-body">
          <tr>
            <td colspan="3" data-i18n="example.hism-compare.table.empty">生成后自动填入对比结果</td>
          </tr>
        </tbody>
      </table>
    </aside>
  </main>
  <script type="module" src="./hism-compare.ts"></script>
</body>

</html>
