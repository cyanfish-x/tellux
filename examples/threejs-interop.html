<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/202607211421862.png" />
  <title>Tellux Three.js Interop</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="example-panel" aria-label="Three.js 互操作控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          aria-expanded="true"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">Three.js 原生互操作</span>
      </header>

      <div class="example-panel__collapse">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">操作</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p class="example-panel__hint">
                  加载 Three.js 官方 keyframes 模型，作为原生 <code>Object3D</code> 放到
                  <span id="model-coordinates-text">模型锚点</span> 的地表位置。
                </p>
                <button class="example-panel__button" id="fly-to-model" type="button">飞到模型</button>
                <button class="example-panel__button example-panel__button--ghost" id="toggle-animation" type="button">
                  暂停动画
                </button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="model-status" class="example-panel__status" aria-live="polite">正在加载 Littlest Tokyo...</p>
                <dl class="example-panel__readout">
                  <dt>API</dt>
                  <dd>viewer.addModel</dd>
                  <dt>坐标</dt>
                  <dd id="model-coordinates">-</dd>
                  <dt>动画</dt>
                  <dd id="model-ready-status">-</dd>
                </dl>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./threejs-interop.ts"></script>
</body>

</html>
