<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="3" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260612224329334.png" />
  <title data-i18n="example.terrain.docTitle">Tellux 天地图地形热切换</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="terrain-panel" data-i18n-attr="aria-label:example.terrain.panel.aria" aria-label="地形热切换控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="terrain-panel-fold"
          aria-expanded="true"
          aria-controls="terrain-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.terrain.panel.title">地形热切换</span>
      </header>

      <div class="example-panel__collapse" id="terrain-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.terrain.folder.source">数据源</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div class="example-panel__field">
                  <label class="example-panel__label" for="terrain-source" data-i18n="example.terrain.label.source">地形来源</label>
                  <select id="terrain-source" class="example-panel__select">
                    <option value="tianditu" data-i18n="example.terrain.option.tianditu">天地图 swdx</option>
                    <option value="cesium-ion" data-i18n="example.terrain.option.cesiumIon">Cesium Ion terrain</option>
                  </select>
                </div>
                <div id="tianditu-terrain-fields">
                  <div class="example-panel__field">
                    <label class="example-panel__label" for="tianditu-token" data-i18n="example.terrain.label.tk">天地图 tk</label>
                    <input id="tianditu-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                  </div>
                  <p id="tianditu-terrain-hint" class="example-panel__hint"></p>
                </div>
                <div id="ion-terrain-fields">
                  <div class="example-panel__field">
                    <label class="example-panel__label" for="ion-terrain-asset-id" data-i18n="example.terrain.label.ionAssetId">Cesium Ion terrain asset id</label>
                    <input id="ion-terrain-asset-id" class="example-panel__input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
                  </div>
                  <div class="example-panel__field">
                    <label class="example-panel__label" for="ion-terrain-token" data-i18n="example.terrain.label.ionToken">Cesium Ion token</label>
                    <input id="ion-terrain-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                  </div>
                </div>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.terrain.folder.toggle">开关</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.terrain.label.enable">启用地形</span>
                  <input id="terrain-enabled" class="example-panel__checkbox" type="checkbox" />
                </label>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.terrain.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="terrain-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./terrain.ts"></script>
</body>

</html>
