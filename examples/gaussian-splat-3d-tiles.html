<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="sandcastle-order" content="3" />
    <title>Tellux Gaussian Splat 3D Tiles</title>
    <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260612223800683.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <div id="viewer"></div>

      <aside class="example-panel" id="splat-panel" aria-label="高斯泼溅 3D Tiles 控件">
        <header class="example-panel__chrome">
          <button
            type="button"
            class="example-panel__fold"
            id="splat-panel-fold"
            aria-expanded="true"
            aria-controls="splat-panel-body"
            title="收起面板"
            aria-label="收起面板"
          ></button>
          <span class="example-panel__title">高斯泼溅 3D Tiles</span>
        </header>

        <div class="example-panel__collapse" id="splat-panel-body">
          <div class="example-panel__content">
            <details class="example-panel__folder" open>
              <summary class="example-panel__folder-summary">数据源</summary>
              <div class="example-panel__folder-collapse">
                <div class="example-panel__folder-body">
                  <div class="example-panel__field">
                    <label class="example-panel__label" for="splat-tileset-url">3DGS tileset.json URL</label>
                    <input id="splat-tileset-url" class="example-panel__input" type="url" autocomplete="off" spellcheck="false" />
                  </div>
                </div>
              </div>
            </details>

            <details class="example-panel__folder" open>
              <summary class="example-panel__folder-summary">选项</summary>
              <div class="example-panel__folder-collapse">
                <div class="example-panel__folder-body">
                  <label class="example-panel__row">
                    <span class="example-panel__label">显示高斯泼溅</span>
                    <input id="splat-visible" class="example-panel__checkbox" type="checkbox" checked />
                  </label>
                </div>
              </div>
            </details>

            <details class="example-panel__folder" open>
              <summary class="example-panel__folder-summary">操作</summary>
              <div class="example-panel__folder-collapse">
                <div class="example-panel__folder-body">
                  <button class="example-panel__button" id="load-splat-tileset" type="button">加载</button>
                  <button class="example-panel__button" id="fly-to-splat" type="button">飞行到目标</button>
                  <button class="example-panel__button example-panel__button--ghost" id="remove-splat-tileset" type="button">移除</button>
                </div>
              </div>
            </details>

            <details class="example-panel__folder" open>
              <summary class="example-panel__folder-summary">状态</summary>
              <div class="example-panel__folder-collapse">
                <div class="example-panel__folder-body">
                  <p id="splat-status" class="example-panel__status" aria-live="polite"></p>
                </div>
              </div>
            </details>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="./gaussian-splat-3d-tiles.ts"></script>
  </body>
</html>
