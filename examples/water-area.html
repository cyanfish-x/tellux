<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="2.1" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/20260823161153657.png" />
  <title data-i18n="example.water-area.docTitle">Tellux WebGPU 水域渲染</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="water-area-panel" data-i18n-attr="aria-label:example.water-area.panel.aria" aria-label="WebGPU 水域渲染控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="water-area-panel-fold"
          aria-expanded="true"
          aria-controls="water-area-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.water-area.panel.title">Water Area</span>
      </header>

      <div class="example-panel__collapse" id="water-area-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.water-area.folder.effect">效果</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-token" data-i18n="example.3d-tiles.label.token">Cesium Ion token</label>
                  <input id="ion-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                </div>
                <label class="example-panel__row">
                  <span class="example-panel__label" data-i18n="example.water-area.label.showAppearance">显示水域外观</span>
                  <input id="water-area-show" class="example-panel__checkbox" type="checkbox" checked disabled />
                </label>
                <p class="example-panel__hint">WebGPU · OSM Shortbread MVT · 8 Workers</p>
                <p class="example-panel__hint" data-i18n="example.water-area.hint.tokenReload">修改 Token 后按 Enter 重新加载案例。</p>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.water-area.folder.appearance">外观</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.color">水色</span>
                  <input id="water-area-color" class="example-panel__input" type="color" value="#06172d" />
                </label>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.colorMix">颜色混合</span>
                  <input id="water-area-color-mix" class="example-panel__input" type="number" min="0" max="1" step="0.05" value="0.8" />
                </label>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.roughness">粗糙度</span>
                  <input id="water-area-roughness" class="example-panel__input" type="number" min="0.05" max="0.8" step="0.01" value="0.34" />
                </label>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.water-area.folder.waves">波纹</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.waveStrength">强度</span>
                  <input id="water-area-wave-strength" class="example-panel__input" type="number" min="0" max="1" step="0.01" value="0.22" />
                </label>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.waveScale">尺度</span>
                  <input id="water-area-wave-scale" class="example-panel__input" type="number" min="0.25" max="4" step="0.05" value="1" />
                </label>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.waveSpeed">速度</span>
                  <input id="water-area-wave-speed" class="example-panel__input" type="number" min="0" max="2" step="0.05" value="1" />
                </label>
                <label class="example-panel__row example-panel__row--input">
                  <span class="example-panel__label" data-i18n="example.water-area.label.waveDirection">方向（°）</span>
                  <input id="water-area-wave-direction" class="example-panel__input" type="number" min="0" max="360" step="1" value="35" />
                </label>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.water-area.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="water-area-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>

    <aside id="google-attributions" class="tile-attributions" data-i18n-attr="aria-label:example.water-area.attr.aria" aria-label="地图数据来源"></aside>
  </main>

  <script type="module" src="./water-area.ts"></script>
</body>

</html>
