<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="2.2" />
  <meta name="sandcastle-thumbnail" content="./images/city.png" />
  <title>Tellux 城市级海量模型加载</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>

    <aside class="example-panel" id="city-panel" aria-label="城市级海量模型加载控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="city-panel-fold"
          aria-expanded="true"
          aria-controls="city-panel-body"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">城市级海量模型</span>
      </header>

      <div class="example-panel__collapse" id="city-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">加载</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <div class="example-panel__field">
                  <label class="example-panel__label" for="ion-token">Cesium Ion token</label>
                  <input id="ion-token" class="example-panel__input" type="password" autocomplete="off" spellcheck="false" />
                </div>
                <button class="example-panel__button" id="load-tileset" type="button">加载 3D Tiles</button>
                <button class="example-panel__button example-panel__button--ghost" id="fly-to-city" type="button">定位到东京</button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="tileset-status" class="example-panel__status" aria-live="polite"></p>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>

    <aside id="google-attributions" class="tile-attributions" aria-label="地图数据来源"></aside>
  </main>
  <script type="module" src="./google-photorealistic-3d-tiles.ts"></script>
</body>

</html>
