<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="70" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/202607021558314.png" />
  <title>Tellux Vegetation Forest</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="example-panel" id="vegetation-panel" aria-label="程序化植被森林控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="vegetation-panel-fold"
          aria-expanded="true"
          aria-controls="vegetation-panel-body"
          title="收起面板"
          aria-label="收起面板"
        ></button>
        <span class="example-panel__title">程序化植被森林</span>
      </header>

      <div class="example-panel__collapse" id="vegetation-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">操作</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <button class="example-panel__button" id="fly-to-forest" type="button">飞到森林</button>
                <button class="example-panel__button example-panel__button--ghost" id="regenerate-vegetation" type="button">
                  重新生成
                </button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="vegetation-status" class="example-panel__status" aria-live="polite">正在准备植被场景...</p>
                <dl class="example-panel__readout">
                  <dt>Center</dt>
                  <dd>103.551329, 31.025122</dd>
                  <dt>Instances</dt>
                  <dd id="vegetation-count">-</dd>
                  <dt>Source</dt>
                  <dd>terrain</dd>
                  <dt>Sampling</dt>
                  <dd id="vegetation-sampling-status">-</dd>
                </dl>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./vegetation.ts"></script>
</body>

</html>
